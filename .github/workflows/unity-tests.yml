name: Unity tests

# Runs all EditMode tests inside Unity via GameCI. Skips cleanly until the Unity login secrets exist.
# Secrets (repo → Settings → Secrets and variables → Actions): UNITY_EMAIL, UNITY_PASSWORD
#
# Personal licence: GameCI signs in with the account (its `personal` licensing method). The .ulf file
# route is deliberately NOT used: Unity removed offline activation for Personal seats, and a .ulf
# copied from Unity Hub fails on the runner ("TimeStamp validation failed", 2026-10-03). Without
# UNITY_LICENSE, GameCI's method chain (file → serial → floating → personal) lands on personal.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write # the test runner posts a "Test Results" check

jobs:
  editmode:
    name: EditMode (Unity)
    runs-on: ubuntu-24.04
    steps:
      - name: Check for Unity login secrets
        id: licence
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: echo "present=$([ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.licence.outputs.present == 'true'

      - uses: actions/cache@v6
        if: steps.licence.outputs.present == 'true'
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/packages-lock.json') }}
          restore-keys: Library-test-

      - uses: game-ci/unity-test-runner@v4
        if: steps.licence.outputs.present == 'true'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
