name: Release

# Push a tag like v1.2.0 → builds Android APK + AAB and a Windows zip, creates a GitHub Release,
# and (if configured) pushes the APK and Windows builds to itch.io.
# Run it by hand (Actions → Release → Run workflow) for a dry run: everything builds and is packaged as a
# "release-dry-run" artifact (signed APK, AAB, Windows zip); nothing is published.
#
# Secrets: UNITY_EMAIL, UNITY_PASSWORD,
#          ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS,
#          BUTLER_API_KEY (itch.io → Settings → API keys)
# Variables: ITCH_USER, ITCH_GAME (leave unset to skip itch.io)
# Unity Personal licence: GameCI's `personal` method signs in with the account. Don't pass a .ulf as
# UNITY_LICENSE: Unity removed offline activation for Personal seats and the Hub's .ulf fails on the
# runner ("TimeStamp validation failed"). unity-builder@v6 (a game-ci/cli wrapper) has that method; v4 doesn't.
# Check input names against https://game.ci/docs/github/builder when upgrading GameCI.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Missing signing or Unity credentials fail here instead of marking a release as skipped/green.
  check:
    name: Release prerequisites
    runs-on: ubuntu-24.04
    steps:
      - name: Require Unity and Android signing secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$UNITY_EMAIL" ]] || missing+=(UNITY_EMAIL)
          [[ -n "$UNITY_PASSWORD" ]] || missing+=(UNITY_PASSWORD)
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$ANDROID_KEYSTORE_PASS" ]] || missing+=(ANDROID_KEYSTORE_PASS)
          [[ -n "$ANDROID_KEYALIAS_NAME" ]] || missing+=(ANDROID_KEYALIAS_NAME)
          [[ -n "$ANDROID_KEYALIAS_PASS" ]] || missing+=(ANDROID_KEYALIAS_PASS)
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required release secrets: %s\n' "${missing[*]}"
            exit 1
          fi

  core-tests:
    name: Core logic (.NET)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Template core
        run: dotnet test Tools/CoreTests/Template.Core.Tests.csproj --nologo
      - name: Night Courier ride rules
        run: dotnet test Tools/GameTests/NightCourier.Core.Tests.csproj --nologo

  unity-tests:
    name: Unity PlayMode + EditMode
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-release-test-${{ hashFiles('Packages/packages-lock.json') }}
          restore-keys: Library-release-test-
      - uses: game-ci/unity-test-runner@v4
        id: unity-tests
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Release Unity tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-unity-test-results
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
          if-no-files-found: warn

  build:
    name: Build ${{ matrix.name }}
    needs: [check, core-tests, unity-tests]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1 # each build signs in and takes a Unity Personal seat; don't hold three at once
      matrix:
        include:
          - name: android-apk
            targetPlatform: Android
            androidExportType: androidPackage
          - name: android-aab
            targetPlatform: Android
            androidExportType: androidAppBundle
          - name: windows
            targetPlatform: StandaloneWindows64
            androidExportType: androidPackage
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GameCI's Semantic versioning reads the tag history

      - uses: jlumbroso/free-disk-space@v2.0.0
        if: matrix.targetPlatform == 'Android'

      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/packages-lock.json') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      - uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          buildsPath: build # the upload step below reads build/<targetPlatform>
          targetPlatform: ${{ matrix.targetPlatform }}
          androidExportType: ${{ matrix.androidExportType }}
          androidKeystoreName: release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          versioning: Semantic
          buildName: game

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: build/${{ matrix.targetPlatform }}

  # On a v* tag: package and publish. On a manual run (dry run): package only, and keep the packaged
  # files as a "release-dry-run" artifact, so the signed APK can be downloaded and tried.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Package release files
        run: |
          set -euo pipefail
          name="${{ github.event.repository.name }}-${{ github.ref_name }}"
          mkdir -p release
          cp dist/android-apk/*.apk "release/${name}.apk"
          cp dist/android-aab/*.aab "release/${name}.aab"
          (cd dist/windows && zip -qr "../../release/${name}-windows.zip" . -x '*_DoNotShip/*')
          ls -la release

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: release-dry-run
          path: release/

      # GitHub first: if itch.io isn't ready (no page yet, key revoked), the release still exists.
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            release/*.apk
            release/*-windows.zip
          generate_release_notes: true

      - name: Push to itch.io
        if: startsWith(github.ref, 'refs/tags/v') && vars.ITCH_USER != '' && vars.ITCH_GAME != ''
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_USER }}/${{ vars.ITCH_GAME }}
        run: |
          set -euo pipefail
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip && chmod +x butler
          ./butler push release/*.apk "$ITCH_TARGET:android" --userversion "${{ github.ref_name }}"
          ./butler push release/*-windows.zip "$ITCH_TARGET:windows" --userversion "${{ github.ref_name }}"
