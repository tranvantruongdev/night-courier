name: Core tests

# Runs the pure C# game logic tests with dotnet: ~1 minute, no Unity licence needed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core logic (dotnet)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Template core
        run: dotnet test Tools/CoreTests/Template.Core.Tests.csproj --nologo
